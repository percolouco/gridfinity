services:
  gridfinity:
    build: .
    container_name: gridfinity
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gridfinity.rule=Host(`gridfinity.nas.percolouco.com`)"
      - "traefik.http.routers.gridfinity.entrypoints=websecure"
      - "traefik.http.routers.gridfinity.tls=true"
      - "traefik.http.routers.gridfinity.tls.certresolver=letsencrypt"
      - "traefik.http.services.gridfinity.loadbalancer.server.port=80"
networks:
  proxy:
    external: true
